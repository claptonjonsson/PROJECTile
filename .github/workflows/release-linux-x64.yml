name: Nightly Release Linux x64

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release-linux-x64
  cancel-in-progress: false

jobs:
  publish-linux:
    name: Build and publish nightly linux-x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if nightly is unchanged
        id: nightly_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nightly_tag="nightly"
          current_sha="${{ github.sha }}"
          release_target="$(gh release view "$nightly_tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --json targetCommitish \
            --jq '.targetCommitish' 2>/dev/null || true)"

          if [ "$release_target" = "$current_sha" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: nightly release already targets ${current_sha}."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        if: steps.nightly_check.outputs.should_publish == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.nightly_check.outputs.should_publish == 'true'
        run: dotnet restore src/PROJECTile.Terminal/PROJECTile.Terminal.csproj

      - name: Publish single-file AOT binary
        if: steps.nightly_check.outputs.should_publish == 'true'
        run: |
          dotnet publish src/PROJECTile.Terminal/PROJECTile.Terminal.csproj \
            -c Release \
            -r linux-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:PublishAot=true

      - name: Prepare artifact
        if: steps.nightly_check.outputs.should_publish == 'true'
        run: |
          mkdir -p out
          published_binary="src/PROJECTile.Terminal/bin/Release/net10.0/linux-x64/publish/PROJECTile.Terminal"
          if [ ! -f "$published_binary" ]; then
            published_binary="$(find src/PROJECTile.Terminal/bin/Release/net10.0/linux-x64/publish -maxdepth 1 -type f -perm -111 -name 'PROJECTile*' | head -n 1)"
          fi
          if [ ! -f "$published_binary" ]; then
            echo "No linux-x64 executable found in publish output" >&2
            exit 1
          fi
          cp "$published_binary" out/PROJECTile
          tar -czf out/PROJECTile-linux-x64.tar.gz -C out PROJECTile

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        if: steps.nightly_check.outputs.should_publish == 'true'
        with:
          name: projectile-linux-x64
          path: out/PROJECTile-linux-x64.tar.gz
          if-no-files-found: error

      - name: Update nightly release
        if: steps.nightly_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nightly_tag="nightly"
          release_name="PROJECTile nightly"

          if gh release view "$nightly_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$nightly_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$release_name"
          else
            gh release create "$nightly_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$release_name" \
              --notes "Automated nightly build from main branch."
          fi

          gh release upload "$nightly_tag" out/PROJECTile-linux-x64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
