name: Release Linux x64

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish-linux:
    name: Build and publish linux-x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if this is a merge commit
        id: merge_check
        run: |
          parent_count=$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF - 1}')
          if [ "$parent_count" -gt 1 ]; then
            echo "is_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_merge=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: push was not a merge commit to main."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        if: steps.merge_check.outputs.is_merge == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.merge_check.outputs.is_merge == 'true'
        run: dotnet restore src/PROJECTile.Terminal/PROJECTile.Terminal.csproj

      - name: Publish single-file AOT binary
        if: steps.merge_check.outputs.is_merge == 'true'
        run: |
          dotnet publish src/PROJECTile.Terminal/PROJECTile.Terminal.csproj \
            -c Release \
            -r linux-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:PublishAot=true

      - name: Prepare artifact
        if: steps.merge_check.outputs.is_merge == 'true'
        run: |
          mkdir -p out
          published_binary="src/PROJECTile.Terminal/bin/Release/net10.0/linux-x64/publish/PROJECTile.Terminal"
          if [ ! -f "$published_binary" ]; then
            published_binary="$(find src/PROJECTile.Terminal/bin/Release/net10.0/linux-x64/publish -maxdepth 1 -type f -perm -111 -name 'PROJECTile*' | head -n 1)"
          fi
          if [ ! -f "$published_binary" ]; then
            echo "No linux-x64 executable found in publish output" >&2
            exit 1
          fi
          cp "$published_binary" out/PROJECTile
          tar -czf out/PROJECTile-linux-x64.tar.gz -C out PROJECTile

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        if: steps.merge_check.outputs.is_merge == 'true'
        with:
          name: projectile-linux-x64
          path: out/PROJECTile-linux-x64.tar.gz
          if-no-files-found: error

      - name: Update nightly release
        if: steps.merge_check.outputs.is_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nightly_tag="nightly"
          release_name="PROJECTile nightly"

          if gh release view "$nightly_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$nightly_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$release_name"
          else
            gh release create "$nightly_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$release_name" \
              --notes "Automated nightly build from main branch."
          fi

          gh release upload "$nightly_tag" out/PROJECTile-linux-x64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
